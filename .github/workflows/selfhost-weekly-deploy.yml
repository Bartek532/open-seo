name: Weekly self-host deploy

# Syncs this fork's main with every-app/open-seo, then deploys selfhost.
# Fork-only (Bartek532/open-seo). Secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, ENV_SELFHOST. If sync fails with a workflow-scope
# error, add FORK_SYNC_TOKEN (classic: repo + workflow; fine-grained: Contents
# + Workflows write on this repo).

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: selfhost-weekly-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync-and-deploy:
    if: github.repository == 'Bartek532/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync fork main with upstream
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          sync_fork() {
            gh api --method POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
          }
          if sync_fork; then
            exit 0
          fi
          if [ -z "$FORK_SYNC_TOKEN" ]; then
            echo "::error::Fork sync failed. When upstream changes .github/workflows, set FORK_SYNC_TOKEN (repo + workflow scope)."
            exit 1
          fi
          GH_TOKEN="$FORK_SYNC_TOKEN" sync_fork

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write .env.selfhost
        run: printf '%s' "$ENV_SELFHOST" > .env.selfhost
        env:
          ENV_SELFHOST: ${{ secrets.ENV_SELFHOST }}

      - run: pnpm deploy:selfhost --yes
